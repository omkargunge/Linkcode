<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Instagram Logins</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      width: 300px;
      text-align: center;
    }

    .language {
      font-size: 14px;
      margin-bottom: 20px;
      color: #8e8e8e;
    }

    .logo {
      font-family: 'Billabong', cursive;
      font-size: 50px;
      margin-bottom: 20px;
    }

    .fb-btn {
      background-color: #1877f2;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 5px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
      cursor: pointer;
    }

    .fb-btn i {
      margin-right: 8px;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 15px 0;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #ccc;
    }

    .divider span {
      margin: 0 10px;
      color: #999;
      font-size: 12px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .forgot {
      text-align: right;
      font-size: 12px;
      margin-top: 5px;
      color: #00376b;
      cursor: pointer;
    }

    .login-btn {
      width: 100%;
      background-color: #0095f6;
      color: white;
      padding: 10px;
      margin-top: 15px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    .signup {
      font-size: 14px;
      margin-top: 20px;
    }

    .signup a {
      color: #0095f6;
      text-decoration: none;
      font-weight: bold;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="language">English ▼</div>
    <div class="logo">Instagram</div>
    <button class="fb-btn">
      <i>📘</i> Continue with Facebook
    </button>

    <div class="divider"><span>OR</span></div>

    <input type="text" placeholder="Phone number, username, or email" />
    <input type="password" placeholder="Password" />
    <div class="forgot">Forgot password?</div>

    <button class="login-btn">Log In</button>

    <div class="signup">
      Don't have an account? <a href="#">Sign up</a>
    </div>

    <div class="footer">from <strong>FACEBOOK</strong></div>
  </div>

</body>
</html>
