<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spotify Clone</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    
    <!-- Sidebar -->
    <div class="sidebar">
      <h1 class="logo">Spotify</h1>
      <ul class="nav">
        <li><a href="#">🏠 Home</a></li>
        <li><a href="#">🔍 Search</a></li>
        <li><a href="#">📚 Your Library</a></li>
      </ul>
      <h2 class="playlist-title">Playlists</h2>
      <ul class="playlists">
        <li><a href="#">My Playlist #1</a></li>
        <li><a href="#">Rock Classics</a></li>
        <li><a href="#">Chill Hits</a></li>
      </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="header">
        <h2>Welcome to Spotify</h2>
      </div>
      <div class="cards">
        <div class="card">
          <img src="https://via.placeholder.com/150" alt="Album" />
          <p>Chill Vibes</p>
        </div>
        <div class="card">
          <img src="https://via.placeholder.com/150" alt="Album" />
          <p>Top 50 Global</p>
        </div>
        <div class="card">
          <img src="https://via.placeholder.com/150" alt="Album" />
          <p>Pop Hits</p>
        </div>
      </div>
    </div>

  </div>

  <!-- Now Playing Bar -->
  <div class="now-playing">
    <div class="track-info">
      <p><strong>Track Name</strong></p>
      <p>Artist Name</p>
    </div>
    <div class="player-controls">
      <button>⏮️</button>
      <button>⏯️</button>
      <button>⏭️</button>
    </div>
    <div class="volume-control">
      🔊 <input type="range" min="0" max="100" value="50">
    </div>
  </div>
</body>
</html>
