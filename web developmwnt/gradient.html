<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 400px;
            width: 400px;
            border: 1px solid;
            display: inline-block;
            margin: 10px;
        }
        .child1{
           /* background-image: linear-gradient(pink,yellow,blue);*/
        background-image: linear-gradient(50deg,pink,yellow,blue);    
        }
        .child2{
            background-image: radial-gradient(orange,white,green);
        }
        .child3{
            background-image: conic-gradient(orange,white,green);
        }

    </style>
</head>
<body>
    <!--gradient-color combination
    1.linear gradient
    2.radial gradient
    3.conic gradient-->

    <div class="child1"></div>
    <div class="child2"></div>
    <div class="child3"></div>
    

    
</body>
</html>
