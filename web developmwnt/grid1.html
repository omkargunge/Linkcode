<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{

            width: 900px;
            background-color: aqua;
            display: grid;
            grid-template-rows: 1fr 2fr 3fr;
            grid-template-columns: 1fr 2fr 1fr 2fr;
            column-gap: 5px;
        }
        .child{
            background-color: red;
        }
        /* #child5{
            background-color: black;
            grid-column: 3/5;
            grid-row: 1/2; */
            /* grid-column-start: 3;
            grid-column-end: 5;

            grid-row-end: 2;
        } */
         #child1{
            background-color: aliceblue;
         }
          #child2{
            background-color: pink;
         }
          #child3{
            background-color: blue;
         }
          #child4{
            background-color: black;
         }
          #child5{
            background-color: sienna;
         }
          #child6{
            background-color: rgb(179, 141, 228);
         }
          #child7{
            background-color:orangered;
         }

            grid-column: 4/5;
         }
          #child9{
            background-color: springgreen;
         }
          #child10{
            background-color: purple;
         }
          #child11{
            background-color: rgb(27, 167, 19);

          #child12{

         }

            grid-area: 4/5;

         } */

</head>

        <div class="child" id="child3"></div>
        <div class="child" id="child4"></div>
        <div class="child" id="child5"></div>
        <div class="child" id="child6"></div>
        <div class="child" id="child7"></div>
        <div class="child" id="child8"></div>
        <div class="child" id="child9"></div>
        <div class="child" id="child10"></div>
        <div class="child" id="child11"></div>
        <div class="child" id="child12"></div>
    </div>
</body>
</html>
