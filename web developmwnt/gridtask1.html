<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .parent
        {
            height: 800px;
            width: 800px;
            background-color: white;
            display: grid;
            grid-template-rows: 2fr 2fr 1fr 3fr ;
            grid-template-columns: 2fr 2fr 1fr 2fr 2fr;
            row-gap: 4px;
            column-gap: 4px;
        }

        .child
        {
            background-color: red;
        }

        #child1
        {
            grid-row: 1/3;
            grid-column: 1/2;
        }

        #child3
        {
            grid-row: 3/5;
            grid-column: 1/2;
        }

        #child2
        {
            grid-column: 2/4;
            grid-row: 1/2;
        }

        #child4
        {
            grid-column: 4/6;
            grid-row: 1/2;
        }

        #child8
        {
            grid-column: 5/6;
            grid-row: 2/5;
        }

        #child5
        {
            grid-column: 2/3;
            grid-row: 2/4;
        }

        #child7
        {
            grid-column: 3/5;
            grid-row: 2/4;
        }

        #child6
        {
            grid-column: 2/4;
            grid-row: 4/5;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child" id="child1"></div>
        <div class="child" id="child2"></div>
        <div class="child" id="child3"></div>
        <div class="child" id="child4"></div>
        <div class="child" id="child5"></div>
        <div class="child" id="child6"></div>
        <div class="child" id="child7"></div>
        <div class="child" id="child8"></div>
        <div class="child" id="child9"></div>

    </div>
</body>
</html>
