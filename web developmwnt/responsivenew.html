<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adventure</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

header {
    position: absolute;
    width: 100%;
    padding: 20px 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
}

.logo {
    font-size: 20px;
    font-weight: bold;
    color: rgb(240, 230, 230);
}

.nav-links {
    list-style: none;
    display: flex;
    gap: 20px;
}

.nav-links a {
    color: white;
    text-decoration: none;
    font-weight: 500;
}

.btn {
    background: #d73a6f;
    color: white;
    padding: 8px 15px;
    border-radius: 20px;
    text-decoration: none;
    font-weight: bold;
}

.hero {
    height: 100vh;
    background: url(./pexels-asim-mateen-166056089-10906000.jpg) no-repeat center center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
    position: relative;
}

.hero::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.3);
}

.hero-text {
    position: relative;
    z-index: 2;
}

.hero-text h3 {
    font-size: 22px;
    font-style: italic;
    margin-bottom: 5px;
}

.underline {
    width: 60px;
    height: 3px;
    background: #e91e63;
    margin: 0 auto 15px;
}

.hero-text h1 {
    font-size: 40px;
    margin-bottom: 20px;
    font-weight: 300;
}
</style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">ADVENTURE</div>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Explore</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#" class="btn">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-text">
            <h3>Explore the world</h3>
            <div class="underline"></div>
            <h1>A wonderful gift</h1>
            <a href="#" class="btn">Learn More</a>
        </div>
    </section>
</body>
</html>
