<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *
        {
            margin: 0;
            padding: 0;
        }

        nav
        {
            height: 120px;
            width: 1534px;
            background-color: white;
            border: solid 1px rgb(208, 208, 208);
            display: inline-block;

        }

        #ulist
        {
            display: grid;
            grid-template-columns: 100px 100px 120px 85px 110px 130px 100px ;
        }

        #list
        {
            display: inline-block;
            margin-top: 48px;
            font-size: 20px;
        }

        #img
        {
            width: 70px;
            margin-top: 25px;
            margin-left: 200px;
        }

        #nav
        {
            /* display: inline-block; */
            display: grid;
            grid-template-columns: 75px 600px 10px ;
            column-gap: 5px;
        }

        #brand
        {
            margin-top: 37px;
            margin-left: 200px;
        }

        #fir
        {
            font-size: 30px;
            font-weight: 700;
        }

        #sec
        {
            color: grey;
        }

        .grey
        {
            color: grey;
        }

        .parent
        {   
            margin: 0;
            margin-top: 45px;
            margin-left: 17px;
            padding: 0;
            height: 577px;
            width: 1500px;
            display: grid;
            background-color: white;
            row-gap: 15px;
            column-gap: 15px;
            grid-template-columns: 3fr 2fr 2fr;
            grid-template-rows: 2fr 1fr;
        }

        .child1
        {
            background-color: black;
            grid-row: 1/3;
            grid-column: 1/2;
            background-image: url(./hexa1.png);
            background-size: cover;
        }

        .child2
        {
            background-color: black;
            background-image: url(./hexa2.png);
            background-size: cover;
        }

        .child3
        {
            background-color: black;
            background-image: url(./hexa3.png);
            background-size: cover;
        }

        .child4
        {
            background-color: black;
            background-image: url(./hexa4.png);
            background-size: cover;
        }

        .child5
        {
            background-color: black;
            background-image: url(./hexa5.png);
            background-size: cover;
        }

        #state
        {
            border: transparent;
            outline: none;
        }

    </style>

</head>
<body>
    <nav>
        <div id="nav">
            <img id="img" src="./polygon1.png"> 
            <span id="brand"><span id="fir">HEXASHOP</span> <br> <span id="sec">ONLINE SHOPPING</span></span>
        

        <ul id="ulist">
            <li id="list" class="grey">Home</li>
            <li id="list">Men's</li>
            <li id="list">Women's</li>
            <li id="list">Kid's</li>
            <form>
                <li id="list">
                    <label for="state">Pages</label>
                    <select name="state" id="state">Pages</select>
                </li>
            </form>
            <form>
                <li id="list">
                    <label for="state">Features</label>
                    <select name="state" id="state">Features</select>
                </li>
            </form>
            <li id="list">Explore</li>
        </ul>

        </div>

        <div class="parent">
            <div class="child1"></div>
            <div class="child2"></div>
            <div class="child3"></div>
            <div class="child4"></div>
            <div class="child5"></div>
        </div>
    </nav>
</body>
</html>
