<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            height: 1000px;
            width: 900px;
            background-color:white;
            display: grid;
            grid-template-rows: 2fr 2fr 1fr 2fr 2fr;
            grid-template-columns: 2fr 2fr 1fr 2fr;
            column-gap: 5px;
            row-gap: 5px;
        }
        .child{
            background-color: red;
            /* grid-row:1/3 ;
            grid-column:1/2 ; */
        }
        #child1{
            background-color: red;
             grid-row:1/4 ;
            grid-column:1/2 ;
         }
          #child2{
            background-color: red;
             grid-row:1/2 ;
            grid-column:2/4 ;
         }
          #child3{
            background-color:red;
            grid-row:1/2 ;
            grid-column:4/5 ;
         }
          #child4{
            background-color:red;
            grid-row:4/6 ;
            grid-column:1/2 ;
         }
          #child5{
            background-color:red;
             grid-row:2/4 ;
            grid-column:1/3 ;
         }
          #child6{
            background-color: red;
             grid-row:2/3 ;
            grid-column:2/3 ;
         }
          #child7{
            background-color:red;
             grid-row:2/3 ;
            grid-column:3/4 ;
         }
          #child8{
            background-color:red;
             /* grid-row:1/3 ;
            grid-column:1/2 ; */
             
         }
          #child9{
            background-color: red;
             /* grid-row:1/3 ;
            grid-column:1/2 ; */
         }
          
    </style>
</head>
<body>
     <div class="parent">
        <div class="child" id="child1"></div>
        <div class="child" id="child2"></div>
        <div class="child" id="child3"></div>
        <div class="child" id="child4"></div>
        <div class="child" id="child5"></div>
        <div class="child" id="child6"></div>
        <div class="child" id="child7"></div>
        <div class="child" id="child8"></div>
        <div class="child" id="child9"></div>
    </div>
</body>
</html>
