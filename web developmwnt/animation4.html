<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents</title>
    <style>
        div{
            height: 600px;
            width: 600px;
            background-image: url(./aniket-bhattacharya-vCv1OoxEpjc-unsplash.jpg);
            background-position: center;
            background-size: cover;
            animation-name: box;
            animation-delay: 3s;
            animation-iteration-count: infinite;
            animation-duration: 4s;
        }
        @keyframes box {
            
            from{
                transform: scaleX(1);
            }
            to{
                transform: scaleX(4);
            }
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
