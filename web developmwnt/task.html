<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>"हॉटेल भाग्यश्री"</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(6, 100px);
      grid-template-rows: repeat(4, 100px);
      gap: 3px;
    }

    .cell {
      width: 100px;
      height: 100px;
      background-size: cover;
      background-position: center;
      border: 1px solid #ccc;
    }
  
    

    .img1 {
      background-image: url(./download\ \(2\).jpeg); /* Replace with your own image path */
    }

    .img2 {
      background-image: url(./download\ \(1\).jpeg); /* Replace with your own image path */
    }
    .img3 {
      background-image: url(./download.jpeg); /* Replace with your own image path */
    }
    .h1 style{
    
      margin-left: 200px;
    }
  </style>
</head>
<body>
  <div>
    <h1 style="display: inline-block ;">"हॉटेल भाग्यश्री"</h1>

    <div class="grid">
    <!-- Row 1 -->
    <div class="cell img1"></div>
    <div class="cell img2"></div>
    <div class="cell img1"></div>
    <div class="cell img2"></div>
    <div class="cell img1"></div>
    <div class="cell img2"></div>

    <!-- Row 2 -->
    <div class="cell img3"></div>
    <div class="cell img1"></div>
    <div class="cell img3"></div>
    <div class="cell img1"></div>
    <div class="cell img3"></div>
    <div class="cell img1"></div>

    <!-- Row 3 -->
    <div class="cell img1"></div>
    <div class="cell img2"></div>
    <div class="cell img1"></div>
    <div class="cell img2"></div>
    <div class="cell img1"></div>
    <div class="cell img2"></div>

    <!-- Row 4 -->
    <div class="cell img3"></div>
    <div class="cell img1"></div>
    <div class="cell img3"></div>
    <div class="cell img1"></div>
    <div class="cell img3"></div>
    <div class="cell img1"></div>
  </div>
  </div>
  

</body>
</html>
