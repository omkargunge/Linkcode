<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents</title>
    <style>
        


.box {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
}

.container {
    width: 250px;
    height: 250px;
    display: flex;
    justify-content: center;
    align-items: center;

}

.box {
    position: absolute;
    display: flex;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
    border: 4px solid rgb(175, 24, 24);

    transform-origin: 50% 50%;
    animation: vortexRotate linear infinite alternate ;
}


.box-1 {
    width: 200px;
    height: 250px;
    z-index: 20;

    animation-duration: 8s;
    animation-delay: 0s;
}

.box-2 {
    width: 190px;
    height: 190px;
    z-index: 19;

    animation-duration: 7.8s;
    animation-delay: 0.1s;
}

.box-3 {
    width: 180px;
    height: 180px;
    z-index: 18;

    animation-duration: 7.6s;
    animation-delay: 0.2s;
}

.box-4 {
    width: 170px;
    height: 170px;
    z-index: 17;
    animation-duration: 7.4s;
    animation-delay: 0.3s;
}

.box-5 {
    width: 160px;
    height: 160px;
    z-index: 16;

    animation-duration: 7.2s;
    animation-delay: 0.4s;
}

.box-6 {
    width: 150px;
    height: 150px;
    z-index: 15;

    animation-duration: 7s;
    animation-delay: 0.5s;
}

.box-7 {
    width: 140px;
    height: 140px;
    z-index: 14;

    animation-duration: 6.8s;
    animation-delay: 0.6s;
}

.box-8 {
    width: 130px;
    height: 130px;
    z-index: 13;

    animation-duration: 6.6s;
    animation-delay: 0.7s;
}

.box-9 {
    width: 120px;
    height: 120px;
    z-index: 12;

    animation-duration: 6.4s;
    animation-delay: 0.8s;
}

.box-10 {
    width: 110px;
    height: 110px;
    z-index: 11;

    animation-duration: 6.2s;
    animation-delay: 0.9s;
}

.box-11 {
    width: 100px;
    height: 100px;
    z-index: 10;

    animation-duration: 6s;
    animation-delay: 1s;
}

.box-12 {
    width: 90px;
    height: 90px;
    z-index: 9;

    animation-duration: 5.8s;
    animation-delay: 1.1s;
}

.box-13 {
    width: 80px;
    height: 80px;
    z-index: 8;
    /* Darker green */
    animation-duration: 5.6s;
    animation-delay: 1.2s;
}

.box-14 {
    width: 70px;
    height: 70px;
    z-index: 7;

    animation-duration: 5.4s;
    animation-delay: 1.3s;
}

.box-15 {
    width: 60px;
    height: 60px;
    z-index: 6;

    animation-duration: 5.2s;
    animation-delay: 1.4s;
}

.box-16 {
    width: 50px;
    height: 50px;
    z-index: 5;

    animation-duration: 5s;
    animation-delay: 1.5s;
}

.box-17 {
    width: 40px;
    height: 40px;
    z-index: 4;

    animation-duration: 4.8s;
    animation-delay: 1.6s;
}

.box-18 {
    width: 30px;
    height: 30px;
    z-index: 3;

    animation-duration: 4.6s;
    animation-delay: 1.7s;
}

.box-19 {
    width: 20px;
    height: 20px;
    z-index: 2;

    animation-duration: 4.4s;
    animation-delay: 1.8s;
}

.box-20 {
    width: 10px;
    height: 10px;

    z-index: 1;

    animation-duration: 4.2s;

    animation-delay: 1.9s;
}


@keyframes vortexRotate {
    0% {
        transform: rotate(0deg);
    }

    100% {
        transform: rotate(45deg);

    }
}
    </style>
</head>
<body>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
    <div class="box4"></div>
    <div class="box5"></div>
    <div class="box6"></div>
    <div class="box7"></div>
    <div class="box8"></div>
    <div class="box9"></div>
    <div class="box10"></div>
    <div class="box11"></div>
    <div class="box12"></div>
    <div class="box13"></div>
    <div class="box14"></div>
    <div class="box15"></div>
    <div class="box16"></div>
    <div class="box17"></div>
    <div class="box18"></div>
    <div class="box19"></div>
    <div class="box20"></div>
    
</body>
</html>
