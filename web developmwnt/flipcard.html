<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flipkart Login</title>
  <link rel="stylesheet" href="./css/all.min.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f1f3f6;
    }

    /* Top navigation bar */
    .navbar {
      display: flex;
      align-items: center;
      background-color: #2874f0;
      padding: 10px;
      color: white;
    }

    .navbar .logo {
      font-size: 20px;
      font-weight: bold;
      margin-right: 20px;
    }

    .navbar input[type="text"] {
      padding: 5px;
      width: 300px;
      margin-right: 20px;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      margin-right: 20px;
      font-weight: bold;
    }

    /* Login container */
    .login-container {
      display: flex;
      width: 400px;
      margin: 80px auto;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
      background-color: white;
    }

    .login-left {
      background-color: #0a5adc;
      color: white;
      padding: 30px;
      width: 40%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .login-left h2 {
      margin-bottom: 20px;
    }

    .login-left p {
      font-size: 12px;
      text-align: center;
    }

    .login-left img {
      margin-top: 30px;
      width: 60px;
    }

    .login-right {
      padding: 30px;
      width: 60%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-right input {
      padding: 10px;
      margin-bottom: 20px;
      width: 100%;
      font-size: 14px;
    }

    .login-right button {
      background-color: #fb641b;
      color: white;
      padding: 10px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .login-right button:hover {
      background-color: #d6642b;
    }
    i{
        color: rgb(63, 63, 209);
        font-size: 50px;
        margin-left: 30px;
    }

  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <div class="navbar">
    <div class="logo">Flipkart</div>
    <input type="text" placeholder="Search for products, brands and more">
    <a href="#">Login1</a>
    <a href="#">Become a Sellers</a>
    <a href="#">More</a>
    <a href="#">Cart</a>
  </div>

  <!-- Login Section -->
  <div class="login-container">
    <div class="login-left">
      <h2>Login</h2>
      <p>Get access to your Orders, Wishlist and Recommendations</p>
      <i class="fa-solid fa-laptop"></i>
      <img src="./laptop-icon-png-25.png" alt="" height="200px" width="500px">
    </div>
    <div class="login-right">
      <input type="text" placeholder="Enter Email/Mobile number">
      <button>Request OTP</button>
    </div>
  </div>

</body>
</html>
